name: Run Pytest (lab6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\lab6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Root:"
          dir
          echo "lab6:"
          dir lab6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install pytest
          }

      - name: Run lab6 tests
        shell: pwsh
        run: |
          echo "Running pytest..."
          if (Test-Path "lab6/tests") {
            pytest lab6/tests -q --maxfail=1 --junitxml=results.xml
          } else {
            pytest -q --maxfail=1 --junitxml=results.xml
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: results.xml
